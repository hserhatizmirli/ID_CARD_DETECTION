<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manuel Kimlik Tanıma (OCR)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { max-width: 1200px; width: 100%; display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px; }
        @media (max-width: 968px) { .container { grid-template-columns: 1fr; } }
        
        .camera-section { background: #1e293b; border-radius: 20px; padding: 20px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 15px; }
        .camera-wrapper { position: relative; background: #000; border-radius: 12px; overflow: hidden; width: 100%; }
        #videoFeed { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .scanner-guide {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            aspect-ratio: 856 / 540; width: 80%; max-height: 80%; 
            border: 2px solid rgba(16, 185, 129, 0.5); pointer-events: none;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65);
            transition: border-color 0.3s;
        }
        .scanner-guide.success { border-color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .scanner-guide::before, .scanner-guide::after, .scanner-guide .corners::before, .scanner-guide .corners::after {
            content: ''; position: absolute; width: 30px; height: 30px; border-color: #10b981; border-style: solid;
        }
        .scanner-guide::before { top: -2px; left: -2px; border-width: 4px 0 0 4px; }
        .scanner-guide::after { top: -2px; right: -2px; border-width: 4px 4px 0 0; }
        .scanner-guide .corners::before { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; }
        .scanner-guide .corners::after { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        button { padding: 14px; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-start { background: #10b981; color: white; grid-column: span 2; }
        .btn-start:hover { background: #059669; }
        .btn-stop { background: transparent; color: #ef4444; border: 1px solid #ef4444; }
        .btn-capture { background: #3b82f6; color: white; }
        .btn-capture:hover:not(:disabled) { background: #2563eb; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .info-section { display: flex; flex-direction: column; gap: 20px; }
        .result-card { background: #1e293b; border-radius: 20px; padding: 24px; border: 1px solid #334155; }
        .result-title { color: #94a3b8; font-size: 0.9rem; text-transform: uppercase; margin-bottom: 15px; }
        
        /* Kesilen Resmi Gösterme Alanı */
        .cropped-preview {
            width: 100%; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155;
            display: none; /* İlk başta gizli */
        }

        .raw-text-box {
            background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 15px;
            min-height: 150px; font-family: monospace; font-size: 1.1rem; color: #10b981;
            display: flex; flex-direction: column; gap: 5px;
        }
        .empty-text { color: #64748b; font-style: italic; text-align: center; margin-top: 50px; font-family: sans-serif; }
    </style>
</head>
<body>

    <div class="container">
        <div class="camera-section">
            <h2 style="font-size: 1.2rem;">📷 Manuel Belge Tarama</h2>
            <div class="camera-wrapper">
                <video id="videoFeed" autoplay playsinline></video>
                <div class="scanner-guide" id="guideBox"><div class="corners"></div></div>
            </div>
            <div class="controls">
                <button class="btn-start" id="startBtn">▶ Kamerayı Başlat</button>
                <button class="btn-capture" id="captureBtn" disabled>📸 Şimdi Tara</button>
                <button class="btn-stop" id="stopBtn" disabled>⏹ Durdur</button>
            </div>
        </div>

        <div class="info-section">
            <div class="result-card">
                <div class="result-title">Sistemin Gördüğü & Okuduğu Alan</div>
                
                <img id="croppedImage" class="cropped-preview" alt="Kesilen Alan" />

                <div class="raw-text-box" id="resultBox">
                    <div class="empty-text">Henüz tarama yapılmadı.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoFeed');
        const guideBox = document.getElementById('guideBox');
        const resultBox = document.getElementById('resultBox');
        const croppedImage = document.getElementById('croppedImage');
        
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const captureBtn = document.getElementById('captureBtn');

        let stream = null;
        let isRunning = false;

        async function startCamera() {
            try {
                const constraints = { video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }};
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                // Kameranın oranını ayarla ki arka plan (python) kesimi ile ekrandaki kutu eşleşsin
                video.onloadedmetadata = () => {
                    const wrapper = document.querySelector('.camera-wrapper');
                    wrapper.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
                };
                
                isRunning = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                captureBtn.disabled = false;

                // OTOMATİK TARAMA DÖNGÜSÜ TAMAMEN SİLİNDİ

            } catch (err) {
                console.error(err);
                alert('Kameraya erişilemedi!');
            }
        }

        function stopCamera() {
            if (stream) stream.getTracks().forEach(track => track.stop());
            video.srcObject = null;
            isRunning = false;
            
            startBtn.disabled = false;
            stopBtn.disabled = true;
            captureBtn.disabled = true;
            guideBox.classList.remove('success');
            croppedImage.style.display = 'none';
            resultBox.innerHTML = '<div class="empty-text">Kamera kapalı.</div>';
        }

        // SADECE BUTONA BASILINCA ÇALIŞACAK FONKSİYON
        async function captureAndDetect() {
            if (!isRunning) return;
            
            // Butonu yükleniyor moduna al ve tıklanmayı engelle
            const originalText = captureBtn.innerHTML;
            captureBtn.innerHTML = "⏳ İşleniyor...";
            captureBtn.disabled = true;

            try {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const imageData = canvas.toDataURL('image/jpeg', 0.9);

                // YENİ HALİ (Ngrok uyumlu):
                const response = await fetch('/detect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageData })
                });

                const result = await response.json();

                if (result.success) {
                    guideBox.classList.add('success');
                    
                    // Python'un kestiği fotoğrafı ekranda göster
                    croppedImage.src = `data:image/jpeg;base64,${result.cropped_image}`;
                    croppedImage.style.display = 'block';

                    // Metinleri yazdır
                    resultBox.innerHTML = '';
                    if (result.raw_texts && result.raw_texts.length > 0) {
                        result.raw_texts.forEach((text) => {
                            const line = document.createElement('div');
                            line.textContent = `> ${text}`;
                            resultBox.appendChild(line);
                        });
                    } else {
                        resultBox.innerHTML = '<div class="empty-text" style="color:#ef4444;">Yazı tespit edilemedi, lütfen tekrar deneyin.</div>';
                    }
                    
                    // Çerçeveyi yarım saniye sonra eski haline getir
                    setTimeout(() => guideBox.classList.remove('success'), 500);
                }
            } catch (err) {
                console.error('Bağlantı Hatası:', err);
                alert("Sunucuya bağlanılamadı.");
            } finally {
                // İşlem bitince butonu eski haline getir
                captureBtn.innerHTML = "📸 Şimdi Tara";
                captureBtn.disabled = false;
            }
        }

        startBtn.addEventListener('click', startCamera);
        stopBtn.addEventListener('click', stopCamera);
        captureBtn.addEventListener('click', captureAndDetect);
    </script>
</body>
</html>
